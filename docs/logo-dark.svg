<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="minikll — quantile sketches">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2247"/>
      <stop offset="1" stop-color="#6b1733"/>
    </linearGradient>
  </defs>

  <!-- icon: rounded tile holding a sorted quantile sketch (median bar accented) -->
  <rect x="40" y="40" width="240" height="240" rx="56" fill="url(#tile)"/>
  <line x1="82" y1="235" x2="238" y2="235" stroke="#f6dde4" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <g>
    <rect x="82"  y="184" width="20" height="50"  rx="8" fill="#f6dde4" fill-opacity="0.92"/>
    <rect x="116" y="163" width="20" height="71"  rx="8" fill="#f6dde4" fill-opacity="0.92"/>
    <rect x="150" y="142" width="20" height="92"  rx="8" fill="#e26a8a"/>
    <rect x="184" y="119" width="20" height="115" rx="8" fill="#f6dde4" fill-opacity="0.92"/>
    <rect x="218" y="95"  width="20" height="139" rx="8" fill="#f6dde4" fill-opacity="0.92"/>
  </g>

  <!-- wordmark (for dark backgrounds) -->
  <g font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="330" y="182" font-size="132" font-weight="700" letter-spacing="-3">
      <tspan fill="#f4dce4">mini</tspan><tspan fill="#e8809f">kll</tspan>
    </text>
    <text x="334" y="232" font-size="27" font-weight="500" letter-spacing="1.5" fill="#9aa4b2">quantile sketches</text>
  </g>
</svg>
