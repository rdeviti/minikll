name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python-bindings:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install pybind11
        run: python -m pip install --upgrade pip pybind11
      - name: Configure
        run: >
          cmake -S . -B build-py -DCMAKE_BUILD_TYPE=Release
          -DMINIKLL_BUILD_TESTS=OFF -DMINIKLL_BUILD_PYTHON=ON
      - name: Build
        run: cmake --build build-py
      - name: Import smoke test
        run: |
          PYTHONPATH=build-py python -c "
          import minikll as kll
          sk = kll.KLLSketch1D(k=64, s=128)
          assert sk.size_limit == 128, sk.size_limit
          ws = kll.WeightedSketch1D.from_sorted_values([1.0, 2.0, 3.0, 4.0], 2)
          print('median', ws.median(), 'arrays', ws.to_arrays())
          "
